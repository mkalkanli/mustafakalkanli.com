<!doctype html>
<html lang="{{meta.documentLanguage}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{meta.title}}</title>
    <meta name="description" content="{{meta.description}}" />
    <meta name="robots" content="{{meta.robots}}" />
    <link rel="canonical" href="{{meta.canonicalUrl}}" />
    <meta property="og:type" content="{{meta.openGraphType}}" />
    <meta property="og:url" content="{{meta.canonicalUrl}}" />
    <meta property="og:site_name" content="{{meta.siteName}}" />
    <meta property="og:title" content="{{meta.title}}" />
    <meta property="og:description" content="{{meta.description}}" />
    <meta name="theme-color" content="{{meta.themeColor}}" />
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="script.js?v=2" defer></script>
    <script type="application/ld+json">{{meta.schemaJson}}</script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{profile.skipLink}}</a>
    <main id="main-content">
      <section id="top" class="profile-card" aria-labelledby="hero-title" data-reveal>
        <h1 id="hero-title">{{profile.name}}</h1>
        <img class="security-art" src="cybersecurity-shield-v3.png" alt="" width="1024" height="1536" />
        <ul aria-label="{{profile.name}}">
          <li>{{profile.areas.0}}</li>
          <li>{{profile.areas.1}}</li>
          <li>{{profile.areas.2}}</li>
        </ul>
        <a class="email-link" href="mailto:{{contact.email}}" aria-label="{{contact.emailLabel}}">{{contact.email}}</a>
      </section>
    </main>
  </body>
</html>
